<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>To-do list</title>
<style>
  :root { color-scheme: light; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 32rem;
    margin: 3rem auto;
    padding: 0 1rem;
    color: #1f2328;
    background: #fff;
  }
  h1 { font-size: 1.5rem; margin-bottom: 1rem; }
  form { display: flex; gap: .5rem; margin-bottom: 1.25rem; }
  input[type="text"] {
    flex: 1;
    padding: .5rem .6rem;
    font: inherit;
    border: 1px solid #d0d7de;
    border-radius: 6px;
  }
  button {
    font: inherit;
    padding: .5rem .9rem;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    background: #f6f8fa;
    cursor: pointer;
  }
  button:hover { background: #eaeef2; }
  ul { list-style: none; margin: 0; padding: 0; }
  .item {
    display: flex;
    align-items: center;
    gap: .5rem;
    padding: .45rem .2rem;
    border-bottom: 1px solid #eaeef2;
  }
  .item label {
    display: flex;
    align-items: center;
    gap: .55rem;
    flex: 1;
    cursor: pointer;
  }
  .item.checked .title {
    color: #6e7781;
    text-decoration: line-through;
  }
  .delete { padding: .25rem .6rem; font-size: .85rem; }
</style>
</head>
<body>
<h1>To-do list</h1>

<form id="new-todo-form">
  <input id="new-todo" type="text" aria-label="New to-do item" placeholder="What needs doing?" autocomplete="off">
  <button type="submit">Add</button>
</form>

<ul id="todo-list"></ul>

<script>
  const form = document.getElementById('new-todo-form');
  const input = document.getElementById('new-todo');
  const list = document.getElementById('todo-list');

  function createItem(title) {
    const item = document.createElement('li');
    item.className = 'item';

    const label = document.createElement('label');
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.addEventListener('change', () => {
      item.classList.toggle('checked', checkbox.checked);
    });

    const titleEl = document.createElement('span');
    titleEl.className = 'title';
    titleEl.textContent = title;

    label.append(checkbox, titleEl);

    const removeButton = document.createElement('button');
    removeButton.type = 'button';
    removeButton.className = 'delete';
    removeButton.textContent = 'Delete';
    removeButton.setAttribute('aria-label', 'Delete ' + title);
    removeButton.addEventListener('click', () => item.remove());

    item.append(label, removeButton);
    return item;
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const title = input.value.trim();
    if (!title) {
      input.focus();
      return;
    }
    list.append(createItem(title));
    input.value = '';
    input.focus();
  });

  input.focus();
</script>
</body>
</html>
